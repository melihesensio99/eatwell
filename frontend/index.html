<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2B211C" />
    <meta name="description" content="EatWell — retro-modern günlük beslenme takibi" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23C85A32'/%3E%3Cpath d='M25 54c12-27 38-28 50-3-10 19-29 27-50 3Z' fill='%23F6EBD8'/%3E%3Ccircle cx='50' cy='48' r='8' fill='%23D6A928'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script src="config.js"></script>
    <title>EatWell — Günlük Takip</title>
  </head>
  <body>
    <div class="grain"></div>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-label="EatWell">
          <span class="brand-icon">✦</span>
          <span>EAT<span class="brand-accent">WELL</span></span>
        </div>
        <div class="top-actions">
          <button class="icon-button" data-action="notifications" aria-label="Bildirimler">♧<span class="notification-dot"></span></button>
          <button class="avatar" data-action="profile" aria-label="Profili aç">M</button>
        </div>
      </header>

      <main id="app-content" class="content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Ana navigasyon">
        <button class="nav-item active" data-tab="home"><span class="nav-icon">⌂</span><span>Ana Sayfa</span></button>
        <button class="nav-item" data-tab="log"><span class="nav-icon">▤</span><span>Günlük</span></button>
        <button class="nav-item" data-tab="recipes"><span class="nav-icon">♨</span><span>Tarifler</span></button>
        <button class="nav-item" data-tab="analytics"><span class="nav-icon">⌁</span><span>Analiz</span></button>
        <button class="nav-item" data-tab="profile"><span class="nav-icon">◎</span><span>Profil</span></button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
